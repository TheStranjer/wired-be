# Cargo configuration for the whole workspace.
#
# `#[sqlx::test]` (decision 13) needs a PostgreSQL to create its throwaway
# databases from and reads its address from `DATABASE_URL`. A checked-in
# repository must not carry a `.env` (see AGENTS.md), so the tests' default
# lives here instead: the same throwaway superuser URL
# `.github/workflows/ci.yml` declares for its Postgres service — never a
# real secret. `force = false` keeps the precedence right: an exported
# `DATABASE_URL` (a developer's own database, the CI job's environment)
# always wins over this default.
[env]
DATABASE_URL = { value = "postgres://postgres:postgres@localhost:5432/postgres", force = false }
