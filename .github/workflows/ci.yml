name: CI

on:
  push:
  pull_request:

concurrency:
  # Every push to master gets its own run, so each landing gets a verdict;
  # other branches still cancel a run a newer push superseded.
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # Reduce artifact size
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Use mold linker (more stable + faster under runner memory limits)
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # Used by the test-database fixture (src/test_db.rs)
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      # Pinned, not `stable`: a new stable release changes rust-cache's key
      # (a cold dependency build, ~10 min) and can bring new denied Clippy
      # lints. Bump this deliberately, fixing any new lints in the same change.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt

      # Save the dependency build even when a check fails; otherwise a red run
      # leaves the next run as cold as this one.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The test databases hold nothing but rows a test just wrote, and the
      # fixture empties every slot before reusing it, so durability is pure
      # cost here. A GitHub service container cannot be started with a command,
      # so turn the three settings off over SQL instead: all of them are
      # reloadable, and `pg_reload_conf()` applies them without a restart.
      # See the README's "Making a local test database fast" for the same
      # settings on a development database — never point this at real data.
      - name: Run Postgres without durability (throwaway test databases)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER SYSTEM SET fsync = off;
          ALTER SYSTEM SET full_page_writes = off;
          ALTER SYSTEM SET synchronous_commit = off;
          SELECT pg_reload_conf();
          SQL
          # Confirm the reload landed before the suite starts paying for it.
          test "$(psql "$DATABASE_URL" -Atc 'SHOW fsync')" = off

      - name: Run CI suite (scripts/ci.sh)
        run: scripts/ci.sh
