[package]
name = "wired-be"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "API-only fediverse backend in Rust/Axum, aiming for Pleroma BE compatibility."
publish = false

[features]
# Compiles the test-only constructors (`Config::for_tests`) into the library
# so the integration tests in `tests/` can use them. Enabled by the
# dev-dependency below; never enabled in a normal build. (Named
# `integration-tests`, not `test-support`: Clippy's denied
# `redundant_feature_names` rejects the `-support` suffix.)
integration-tests = []

[dependencies]
# HTML sanitizing (`src/util/sanitize.rs`): an allowlist-based sanitizer
# built on html5ever, matching Pleroma's scrubbing policy.
ammonia = "4.2.1"
# Password hashing (`src/util/password.rs`): argon2 for new PHC hashes —
# 0.6 has no `std` feature, its `password-hash`/`getrandom` defaults cover
# what `src/util/password.rs` needs — pbkdf2 and base64 for Pleroma's legacy
# Comeonin hashes, bcrypt for its bcrypt hashes.
argon2 = { version = "0.6.0", features = ["password-hash"] }
# The web framework (`src/lib.rs`, `src/api/`). `multipart` is what the upload
# extractor of `src/extract/multipart.rs` needs; `ws` is the WebSocket upgrade
# behind `/api/v1/streaming` (`src/api/streaming.rs`): handshake, frames and
# the server-side ping come from the `tokio-tungstenite` this feature enables.
axum = { version = "0.8.9", features = ["multipart", "ws"] }
# Base32 secrets for two-factor auth (`src/util/totp.rs`): RFC 4648
# encoding/decoding is what authenticator apps display and consume.
base32 = "0.5.1"
base64 = "0.23.1"
bcrypt = "0.19.3"
# `Blurhash` placeholder strings for uploaded images
# (`src/services/media_processing.rs`): the encoder over an RGBA buffer is
# all the upload path needs, so the optional `image`/`gdk-pixbuf`
# integrations stay off (the conversion is done with `image` directly).
blurhash = "0.2.3"
# Byte buffers (`src/http_client.rs`): buffered response bodies and the
# incremental read buffer. `reqwest` re-exports it, but the wrapper names
# the types directly.
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
dotenvy = "0.15.7"
# Concurrent remote mention lookups (`src/services/mentions.rs`):
# `future::join_all` runs every unknown-remote lookup of one status at the
# same time under one shared `tokio::time::timeout` budget. The default
# features (`std`, `async-await`) are all the combinator needs.
futures = "0.3.34"
# HMAC (`src/util/totp.rs`): RFC 6238/4226 TOTP is HMAC-SHA1 over the time
# step; `sha1` below supplies the hash, `subtle` the constant-time compare.
hmac = "0.13.0"
# Bounded request-body reads (`src/federation/inbox_auth.rs`): `Limited`
# enforces the inbox's `INBOX_MAX_BYTES` cap while the body streams in, and
# `BodyExt::collect` buffers the capped frames. The default features are all
# this needs.
http-body-util = "0.1.5"
# Image analysis for media uploads (`src/services/media_processing.rs`):
# dimensions, `_small` previews and the pixel data behind the `Blurhash`
# string. Only the four formats the ticket names are compiled in, and the
# `png`/`jpeg`/`gif` features carry the encoders the thumbnails need;
# `webp` is decoder-side only, which is all the upload path asks of it.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Magic-byte media detection for uploads (`src/api/media.rs`): an upload's type
# is what its bytes say, not what the client's part header claimed. The default
# matchers (image, video and audio among them) are all the endpoint needs.
infer = "0.22.0"
# SMTP mailer (`src/mailer.rs`): the async `tokio1` transport with rustls only
# (never native-tls), plus the message builder for the text and HTML parts; the
# default features (native-tls, pool, hostname, the sendmail and file
# transports) stay off.
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
# VAPID signing keys for Web Push (`src/services/vapid.rs`): the ES256
# (P-256) key pair the instance generates and stores in `instance_secrets`
# as PKCS#8 PEM beside its URL-safe base64 public point. `ecdsa` is the
# signing scheme VAPID uses, `pkcs8` + `pem` the stored encoding, and
# `getrandom` lets `Generate::try_generate` draw the secret from the
# system CSPRNG (`rand` 0.8 above speaks the old `rand_core` these types
# do not take).
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "pem", "getrandom"] }
pbkdf2 = { version = "0.13.0", features = ["sha2"] }
# Markdown for `text/markdown` statuses (`src/util/format.rs`): only the pull
# parser is used, so the default features (`html`, `getopts`,
# `pulldown-cmark-escape`) are off — `render_markdown` renders the event stream
# itself and sanitizes it with `ammonia`.
pulldown-cmark = { version = "0.13.4", default-features = false }
# XML for both directions of the feed and federation surface: the reader
# (`Reader`/`Event`) parses the XRD documents of the WebFinger client
# (`src/federation/webfinger_client.rs`), and the writer (`Writer`, always
# compiled in) builds the Atom/RSS documents of `src/feeds.rs` so every
# database-sourced string is escaped by the library. The optional features
# (encoding detection, serialize, serde-types) stay off.
quick-xml = "0.42.0"
# RSA key pairs and SHA-256 signing (`src/util/keys.rs`): rsa with PEM and
# PKCS#1 v1.5 support, rand pinned to the 0.8 line because rsa 0.9 takes a
# `rand_core` 0.6 RNG (rand 0.9+ switched lines), and sha2 with `oid` so the
# signing keys carry the SHA-256 DigestInfo prefix. (`base64` above already
# covers encoding the signatures into HTTP headers.)
rand = "0.8"
# Mention/hashtag extraction (`src/util/entities.rs`): the regex engine for
# the two entity patterns (`\p{L}`/`\p{N}` classes for hashtag words); the
# crate is automaton-based, so matching is linear time, no backtracking.
regex = "1.13.1"
# Outbound HTTP (`src/http_client.rs`): default-features off, rustls only
# (never native-tls), with `stream` so `get_limited` can cap response bodies.
# The ticket's `rustls-tls` feature is reqwest 0.13's renamed `rustls`
# feature (rustls + platform trust store; it is also 0.13's `default-tls`).
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rsa = { version = "0.9.10", features = ["sha2", "pem"] }
# HTML parsing for rich media cards (`src/services/rich_media.rs`): the
# html5ever-backed tree and CSS selector engine `parse_card` reads the
# `og:*`/`twitter:*` meta tags and the `<title>` with (the crate already
# pulls html5ever in through `ammonia` above). The default features (the
# `scraper` binary behind `main`, the parse-error log behind `errors`) stay
# off — the library API this uses works without them.
scraper = { version = "0.29.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# SHA-1 (`src/util/totp.rs`): the hash RFC 6238 pins for TOTP. (SHA-256 for
# backup-code hashes stays on `sha2` above; SHA-1 here is a MAC ingredient,
# never a collision-resistant digest.)
sha1 = "0.11.0"
sha2 = { version = "0.10", features = ["oid"] }
# HMAC-SHA256 (`src/services/media_proxy.rs`): `hmac` 0.13 speaks `digest`
# 0.11, which the `sha2` above (0.10, pinned there by `rsa`'s `sha2`
# feature) does not, so the proxy hashes through this alias of the newer
# sha2 line already in the tree via `pbkdf2` and `sqlx` (0.11.0).
sha2_011 = { version = "0.11.0", package = "sha2" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "json", "chrono"] }
# Constant-time equality (`src/util/totp.rs`): comparing user-supplied
# one-time codes must not leak how close they were through timing.
subtle = "2.6.1"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "timeout", "limit", "request-id", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Extended grapheme clusters for the reaction emoji check (`src/util/emoji.rs`):
# one emoji is one cluster, and only the cluster rule can say that
# a ZWJ family or a flag pair is a single reaction while two emojis side by
# side are not. `graphemes(true)` is all the crate is used for, so the default
# features stay on and nothing else is enabled.
unicode-segmentation = "1.12.0"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
# Emoji pack archives (`src/services/emoji_packs.rs`): the `GET
# /api/v1/pleroma/emoji/packs/archive` download is a zip; only in-memory
# writing with the deflate method is used, so the default features (crypto,
# zstd, bzip2, …) stay off.
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The `Stream`/`Sink` traits a `tokio-tungstenite` client socket is driven
# through in `tests/api/streaming.rs`; named here so the `sink` feature the
# tests use is this crate's own and not only what the client enables.
futures-util = { version = "0.3.34", features = ["sink", "std"] }
# Throwaway directories for the upload tests (`src/uploads.rs`,
# `tests/media.rs`): `TempDir` makes one per test and removes it on drop, so
# no test writes into the repository.
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util"] }
# The WebSocket client the streaming tests drive a real listener with
# (`tests/api/streaming.rs`), on the same 0.29 line `axum`'s `ws` feature
# upgrades with, so client and server speak one tungstenite. Its default
# `connect` + `handshake` features are all `connect_async` needs: the tests
# talk plain HTTP to `127.0.0.1`, so no TLS stays compiled in.
tokio-tungstenite = "0.29"
tower = { version = "0.5.3", features = ["util"] }
tracing-core = "0.1.36"
# Self-dependency: turns on `integration-tests` for the integration tests only.
wired-be = { path = ".", features = ["integration-tests"] }
# Reading the archive download back in `tests/emoji_packs.rs`; same build of
# `zip` the library uses (see `[dependencies]`).
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[profile.dev]
# Full debuginfo made every debug binary hundreds of megabytes, and linking
# and writing those dominated test builds. Line tables keep file:line in
# backtraces and profilers at a fraction of the size; raise `debug` to
# `true` for the odd session of stepping through dependencies.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies (RSA, Argon2, PBKDF2, bcrypt, image codecs) are
# unusably slow at opt-level 0; our own crate stays unoptimized so
# incremental rebuilds stay fast.
opt-level = 3
# Dependencies' debuginfo is dead weight in every binary that links them:
# we debug our own code, not the crates.io sources.
debug = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_results = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
let_underscore_drop = "deny"
single_use_lifetimes = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
meta_variable_misuse = "deny"
redundant_lifetimes = "deny"
non_ascii_idents = "deny"
unit_bindings = "deny"
warnings = "deny"

[lints.clippy]
# Whole groups, at lower priority so individual lints below can override.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Fires on duplicate versions deep in the dependency tree (e.g. via sqlx), which our code cannot fix.
multiple_crate_versions = "allow"


# Hand-picked `restriction` lints.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_conversions = "deny"
as_underscore = "deny"
assertions_on_result_states = "deny"
clone_on_ref_ptr = "deny"
create_dir = "deny"
dbg_macro = "deny"
default_union_representation = "deny"
deref_by_slicing = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
exit = "deny"
expect_used = "deny"
filetype_is_file = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
format_push_string = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
impl_trait_in_params = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
integer_division = "deny"
large_include_file = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
missing_asserts_for_indexing = "deny"
missing_docs_in_private_items = "deny"
mixed_read_write_in_expression = "deny"
multiple_inherent_impl = "deny"
mutex_atomic = "deny"
needless_raw_strings = "deny"
panic = "deny"
panic_in_result_fn = "deny"
partial_pub_fields = "deny"
print_stderr = "deny"
print_stdout = "deny"
pub_without_shorthand = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_type_annotations = "deny"
ref_patterns = "deny"
renamed_function_params = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
semicolon_inside_block = "deny"
shadow_unrelated = "deny"
str_to_string = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
tests_outside_test_module = "deny"
todo = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
unreachable = "deny"
unseparated_literal_suffix = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
use_debug = "deny"
verbose_file_reads = "deny"
wildcard_enum_match_arm = "deny"
